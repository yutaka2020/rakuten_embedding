services:
  api:
    build: .
    container_name: rakuten_api
    ports:
      - "8000:8000"
    environment:

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/rakuten

      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:

      - .:/app
    depends_on:
      - db
    command: uvicorn search_api:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    container_name: rakuten_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rakuten
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rakuten_pgdata:/var/lib/postgresql/data

volumes:
  rakuten_pgdata:
